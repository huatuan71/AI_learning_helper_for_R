<svg xmlns="http://www.w3.org/2000/svg" width="720" height="736" viewBox="0 0 720 736" role="img" aria-labelledby="title desc">
<title id="title">K22 SVD的三部分</title>
<desc id="desc">X等于U乘D乘V的转置。X为4行3列，U为4行3列，D为3个奇异值10.065、5.421、1.143组成的对角矩阵，V转置为3行3列。下方三段横条表示占比76.7%、22.3%和1.0%。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#79bdf1" stroke-width="1.5"/></marker></defs>
<rect width="720" height="736" rx="20" fill="#030813"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#b7c5d4">
<text x="36" y="62" font-size="32" font-weight="700" fill="#f5f9ff">K22 SVD的三部分</text>
<rect x="36" y="120" width="104" height="150" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="88.0" y="199.0" font-size="28" fill="#f5f9ff" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">X</text>
<text x="88.0" y="302" font-size="21" fill="#9eafc2" text-anchor="middle">4 × 3</text>
<text x="168" y="200" font-size="30" fill="#9eafc2" text-anchor="middle">=</text>
<rect x="196" y="120" width="104" height="150" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="248.0" y="199.0" font-size="28" fill="#f5f9ff" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">U</text>
<text x="248.0" y="302" font-size="21" fill="#9eafc2" text-anchor="middle">4 × 3</text>
<rect x="330" y="140" width="120" height="110" rx="12" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="390.0" y="199.0" font-size="28" fill="#f5f9ff" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">D</text>
<text x="390.0" y="282" font-size="21" fill="#9eafc2" text-anchor="middle">3 个奇异值</text>
<rect x="480" y="140" width="110" height="110" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="535.0" y="199.0" font-size="28" fill="#f5f9ff" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">t(V)</text>
<text x="535.0" y="282" font-size="21" fill="#9eafc2" text-anchor="middle">3 × 3</text>
<text x="36" y="380" font-size="24" fill="#79bdf1" font-weight="700">奇异值</text>
<text x="140" y="380" font-size="24" fill="#f5f9ff" font-family="Consolas, Menlo, monospace">10.065　5.421　1.143</text>
<text x="36" y="450" font-size="24" fill="#79bdf1" font-weight="700">平方占比</text>
<rect x="36.0" y="470" width="460.2" height="44" fill="#79bdf1" rx="4"/>
<text x="266.1" y="500" font-size="22" fill="#030813" font-weight="700" text-anchor="middle">76.7%</text>
<rect x="500.2" y="470" width="133.8" height="44" fill="#7fd1b0" rx="4"/>
<text x="567.1" y="500" font-size="22" fill="#030813" font-weight="700" text-anchor="middle">22.3%</text>
<rect x="638.0" y="470" width="8.0" height="44" fill="#f2b56b" rx="4"/>
<text x="680" y="548" font-size="20" fill="#f2b56b" text-anchor="end">1.0%</text>
<rect x="36" y="580" width="648" height="110" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="624" font-size="28" fill="#79bdf1" font-weight="700">前两个成分约占 99%</text>
<text x="58" y="666" font-size="25" fill="#b7c5d4">两门课评分相似、第三门相反，结构很简单</text>
</g>
</svg>
