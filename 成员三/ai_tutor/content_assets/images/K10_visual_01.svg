<svg xmlns="http://www.w3.org/2000/svg" width="720" height="896" viewBox="0 0 720 896" role="img" aria-labelledby="title desc">
<title id="title">K10 四种索引方式</title>
<desc id="desc">五个成绩格子78、92、65、88、54，编号1到5。正位置c(1,3)选中第1和第3格；负位置-1去掉第1格；逻辑条件score&gt;=80选中92和88；which(score&lt;60)返回位置5。</desc>
