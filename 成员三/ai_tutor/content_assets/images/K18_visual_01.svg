<svg xmlns="http://www.w3.org/2000/svg" width="720" height="894" viewBox="0 0 720 894" role="img" aria-labelledby="title desc">
<title id="title">K18 编号格式的正则拆解</title>
<desc id="desc">正则模式拆成五段：开头锚点、三个大写字母、连字符、四位数字、连字符、两位数字、结尾锚点。合格编号FIN-2026-01逐段对应；不合格编号fin-2026-2在第一段因小写失败，在最后一段因只有一位数字失败。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#79bdf1" stroke-width="1.5"/></marker></defs>
<rect width="720" height="894" rx="20" fill="#030813"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#b7c5d4">
<text x="36" y="62" font-size="32" font-weight="700" fill="#f5f9ff">K18 编号格式的正则拆解</text>
<text x="36" y="106" font-size="22" fill="#9eafc2">合格：FIN-2026-01　　不合格：fin-2026-2</text>
<text x="500" y="150" font-size="22" fill="#7fd1b0" font-weight="700" text-anchor="middle">合格</text>
<text x="620" y="150" font-size="22" fill="#f2b56b" font-weight="700" text-anchor="middle">不合格</text>
<rect x="36" y="170" width="648" height="72" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="216" font-size="27" fill="#79bdf1" font-weight="700" font-family="Consolas, Menlo, monospace">^</text>
<text x="270" y="216" font-size="23" fill="#9eafc2">开头</text>
<text x="500" y="216" font-size="26" fill="#7fd1b0" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace"></text>
<text x="620" y="216" font-size="26" fill="#9eafc2" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace"></text>
<rect x="36" y="254" width="648" height="72" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="300" font-size="27" fill="#79bdf1" font-weight="700" font-family="Consolas, Menlo, monospace">[A-Z]{3}</text>
<text x="270" y="300" font-size="23" fill="#9eafc2">3个大写字母</text>
<text x="500" y="300" font-size="26" fill="#7fd1b0" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">FIN</text>
<text x="620" y="300" font-size="26" fill="#f2b56b" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">fin ✗</text>
<rect x="36" y="338" width="648" height="72" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="384" font-size="27" fill="#79bdf1" font-weight="700" font-family="Consolas, Menlo, monospace">-</text>
<text x="270" y="384" font-size="23" fill="#9eafc2">连字符</text>
<text x="500" y="384" font-size="26" fill="#7fd1b0" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">-</text>
<text x="620" y="384" font-size="26" fill="#9eafc2" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">-</text>
<rect x="36" y="422" width="648" height="72" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="468" font-size="27" fill="#79bdf1" font-weight="700" font-family="Consolas, Menlo, monospace">[0-9]{4}</text>
<text x="270" y="468" font-size="23" fill="#9eafc2">4位数字</text>
<text x="500" y="468" font-size="26" fill="#7fd1b0" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">2026</text>
<text x="620" y="468" font-size="26" fill="#9eafc2" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">2026</text>
<rect x="36" y="506" width="648" height="72" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="552" font-size="27" fill="#79bdf1" font-weight="700" font-family="Consolas, Menlo, monospace">-</text>
<text x="270" y="552" font-size="23" fill="#9eafc2">连字符</text>
<text x="500" y="552" font-size="26" fill="#7fd1b0" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">-</text>
<text x="620" y="552" font-size="26" fill="#9eafc2" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">-</text>
<rect x="36" y="590" width="648" height="72" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="636" font-size="27" fill="#79bdf1" font-weight="700" font-family="Consolas, Menlo, monospace">[0-9]{2}</text>
<text x="270" y="636" font-size="23" fill="#9eafc2">2位数字</text>
<text x="500" y="636" font-size="26" fill="#7fd1b0" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">01</text>
<text x="620" y="636" font-size="26" fill="#f2b56b" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">2 ✗</text>
<rect x="36" y="674" width="648" height="72" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="720" font-size="27" fill="#79bdf1" font-weight="700" font-family="Consolas, Menlo, monospace">$</text>
<text x="270" y="720" font-size="23" fill="#9eafc2">结尾</text>
<text x="500" y="720" font-size="26" fill="#7fd1b0" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace"></text>
<text x="620" y="720" font-size="26" fill="#9eafc2" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace"></text>
<text x="36" y="808" font-size="24" fill="#b7c5d4">去掉 ^ 和 $ 后，只要中间一段符合就会命中，</text>
<text x="36" y="844" font-size="24" fill="#b7c5d4">格式校验必须加锚点。</text>
</g>
</svg>
