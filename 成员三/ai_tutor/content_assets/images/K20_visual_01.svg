<svg xmlns="http://www.w3.org/2000/svg" width="720" height="826" viewBox="0 0 720 826" role="img" aria-labelledby="title desc">
<title id="title">K20 绑定方向与转置</title>
<desc id="desc">左上为rbind，原矩阵下方追加一行，要求列数相同；左下为cbind，原矩阵右侧追加一列，要求行数相同；右侧为转置，2行3列的网格沿对角线翻转成3行2列。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#79bdf1" stroke-width="1.5"/></marker></defs>
