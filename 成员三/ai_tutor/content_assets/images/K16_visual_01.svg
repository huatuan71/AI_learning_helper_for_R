<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img" aria-labelledby="title desc">
<title id="title">K16 字符位置标尺</title>
<desc id="desc">编号FIN-3302拆成8个格子，位置1到8。位置1到3的FIN由substr(id,1,3)取出，位置4是连字符，位置5到8的3302由substr(id,5,8)取出。下方说明nchar数格子里的字符，length数向量中有几个编号。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#79bdf1" stroke-width="1.5"/></marker></defs>
<rect width="720" height="780" rx="20" fill="#030813"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#b7c5d4">
<text x="36" y="62" font-size="32" font-weight="700" fill="#f5f9ff">K16 字符位置标尺</text>
<text x="36" y="112" font-size="26" fill="#79bdf1" font-weight="700">id 中的一个编号 "FIN-3302"</text>
<rect x="36" y="200" width="72" height="64" rx="10" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="72.0" y="241.0" font-size="26" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">F</text>
<text x="72.0" y="188" font-size="20" fill="#9eafc2" text-anchor="middle">1</text>
<rect x="116" y="200" width="72" height="64" rx="10" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="152.0" y="241.0" font-size="26" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">I</text>
<text x="152.0" y="188" font-size="20" fill="#9eafc2" text-anchor="middle">2</text>
<rect x="196" y="200" width="72" height="64" rx="10" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="232.0" y="241.0" font-size="26" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">N</text>
<text x="232.0" y="188" font-size="20" fill="#9eafc2" text-anchor="middle">3</text>
<rect x="276" y="200" width="72" height="64" rx="10" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="312.0" y="241.0" font-size="26" fill="#9eafc2" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">-</text>
<text x="312.0" y="188" font-size="20" fill="#9eafc2" text-anchor="middle">4</text>
<rect x="356" y="200" width="72" height="64" rx="10" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="392.0" y="241.0" font-size="26" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">3</text>
<text x="392.0" y="188" font-size="20" fill="#9eafc2" text-anchor="middle">5</text>
<rect x="436" y="200" width="72" height="64" rx="10" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="472.0" y="241.0" font-size="26" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">3</text>
<text x="472.0" y="188" font-size="20" fill="#9eafc2" text-anchor="middle">6</text>
<rect x="516" y="200" width="72" height="64" rx="10" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="552.0" y="241.0" font-size="26" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">0</text>
<text x="552.0" y="188" font-size="20" fill="#9eafc2" text-anchor="middle">7</text>
<rect x="596" y="200" width="72" height="64" rx="10" fill="#123352" stroke="#79bdf1" stroke-width="2"/>
<text x="632.0" y="241.0" font-size="26" fill="#f5f9ff" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">2</text>
<text x="632.0" y="188" font-size="20" fill="#9eafc2" text-anchor="middle">8</text>
<path d="M36,290 v14 h232 v-14" fill="none" stroke="#79bdf1" stroke-width="2.5"/>
<text x="152" y="338" font-size="23" fill="#79bdf1" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">substr(id, 1, 3)</text>
<text x="152" y="372" font-size="23" fill="#f5f9ff" text-anchor="middle" font-family="Consolas, Menlo, monospace">→ "FIN"</text>
<path d="M356,290 v14 h312 v-14" fill="none" stroke="#7fd1b0" stroke-width="2.5"/>
<text x="512" y="338" font-size="23" fill="#7fd1b0" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">substr(id, 5, 8)</text>
<text x="512" y="372" font-size="23" fill="#f5f9ff" text-anchor="middle" font-family="Consolas, Menlo, monospace">→ "3302"</text>
<rect x="36" y="430" width="648" height="110" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="474" font-size="28" fill="#79bdf1" font-weight="700" font-family="Consolas, Menlo, monospace">nchar("FIN-3302") = 8</text>
<text x="58" y="516" font-size="25" fill="#b7c5d4">数格子里有几个字符，起止位置都包含</text>
<rect x="36" y="560" width="648" height="110" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="604" font-size="28" fill="#79bdf1" font-weight="700" font-family="Consolas, Menlo, monospace">length(id) = 3</text>
<text x="58" y="646" font-size="25" fill="#b7c5d4">id 里有三个编号，每个编号算一个元素</text>
<text x="36" y="730" font-size="24" fill="#9eafc2">截取依赖格式统一：先用 nchar() 检查长度。</text>
</g>
</svg>
