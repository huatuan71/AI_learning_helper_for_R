<svg xmlns="http://www.w3.org/2000/svg" width="720" height="822" viewBox="0 0 720 822" role="img" aria-labelledby="title desc">
<title id="title">K03 从问题到可复现记录</title>
<desc id="desc">四步路径。先写清实际结果与期望，再查函数帮助，然后保留含NA的三项最小输入复现问题，最后记录代码、输出和sessionInfo交给他人核验。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#79bdf1" stroke-width="1.5"/></marker></defs>
<rect width="720" height="822" rx="20" fill="#030813"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#b7c5d4">
<text x="36" y="62" font-size="32" font-weight="700" fill="#f5f9ff">K03 从问题到可复现记录</text>
<rect x="36" y="106" width="648" height="118" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="147" font-size="30" font-weight="700" fill="#79bdf1">描述问题</text>
<text x="58" y="191" font-size="27" fill="#b7c5d4">实际得到 NA，期望计算已有分数</text>
<path d="M360,226 V245" stroke="#79bdf1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="254" width="648" height="118" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="295" font-size="30" font-weight="700" fill="#79bdf1">查看帮助</text>
<text x="58" y="339" font-size="27" fill="#b7c5d4">?mean 或 help(&quot;mean&quot;)</text>
<path d="M360,374 V393" stroke="#79bdf1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="402" width="648" height="118" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="443" font-size="30" font-weight="700" fill="#79bdf1">构造最小复现</text>
<text x="58" y="487" font-size="27" fill="#b7c5d4">mean(c(60, NA, 80))</text>
<path d="M360,522 V541" stroke="#79bdf1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="550" width="648" height="118" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="591" font-size="30" font-weight="700" fill="#79bdf1">记录会话与结果</text>
<text x="58" y="635" font-size="27" fill="#b7c5d4">代码、输出、sessionInfo()</text>
<text x="36" y="757" font-size="27" fill="#9eafc2">保留触发问题的数据特征，逐步减少无关步骤。</text>
</g>
</svg>
