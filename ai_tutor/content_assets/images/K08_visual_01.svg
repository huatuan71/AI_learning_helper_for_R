<svg xmlns="http://www.w3.org/2000/svg" width="720" height="822" viewBox="0 0 720 822" role="img" aria-labelledby="title desc">
<title id="title">K08 解析、日期运算与时区显示</title>
<desc id="desc">四层映射。字符串2026/11/01用年、月、日格式解析成Date，日期到11月11日相差10天。上海时间11月1日00时30分对应UTC的10月31日16时30分，同一时间点可跨显示日期。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#79bdf1" stroke-width="1.5"/></marker></defs>
<rect width="720" height="822" rx="20" fill="#030813"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#b7c5d4">
<text x="36" y="62" font-size="32" font-weight="700" fill="#f5f9ff">K08 解析、日期运算与时区显示</text>
<rect x="36" y="106" width="648" height="118" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="147" font-size="30" font-weight="700" fill="#79bdf1">字符日期</text>
<text x="58" y="191" font-size="27" fill="#b7c5d4">&quot;2026/11/01&quot; 配合 %Y/%m/%d</text>
<path d="M360,226 V245" stroke="#79bdf1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="254" width="648" height="118" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="295" font-size="30" font-weight="700" fill="#79bdf1">Date 日期</text>
<text x="58" y="339" font-size="27" fill="#b7c5d4">2026-11-01 到 11-11 相差 10 天</text>
<rect x="36" y="402" width="648" height="118" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="443" font-size="30" font-weight="700" fill="#79bdf1">上海时间点</text>
<text x="58" y="487" font-size="27" fill="#b7c5d4">2026-11-01 00:30 Asia/Shanghai</text>
<path d="M360,522 V541" stroke="#79bdf1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="550" width="648" height="118" rx="12" fill="#0c1522" stroke="#294158" stroke-width="2"/>
<text x="58" y="591" font-size="30" font-weight="700" fill="#79bdf1">同一时间点的 UTC 显示</text>
<text x="58" y="635" font-size="27" fill="#b7c5d4">2026-10-31 16:30 UTC</text>
<text x="36" y="757" font-size="27" fill="#9eafc2">解析时说明输入时区，展示和按月统计也说明时区。</text>
</g>
</svg>
